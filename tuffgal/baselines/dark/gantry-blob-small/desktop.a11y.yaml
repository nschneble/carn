  - region "src/manifest.ts":
    - code: "// the manifest gantry reads at boot: one rig per slot, six slots on // the frame, and nothing else touches this file import { readFileSync } from \"node:fs\"; import { join } from \"node:path\"; export type Rig = { slot: string; name: string; weightKg: number; installed: string; }; const manifestPath = join(process.cwd(), \"rigs.json\"); const maxSlots = 6; function parseManifest(raw: string): Rig[] { const parsed = JSON.parse(raw) as unknown; if (!Array.isArray(parsed)) { throw new Error(\"rigs.json must be an array\"); } return parsed as Rig[]; } export function loadRigs(): Rig[] { const raw = readFileSync(manifestPath, \"utf8\"); const rigs = parseManifest(raw); if (rigs.length > maxSlots) { throw new Error(`gantry holds ${maxSlots} rigs, manifest lists ${rigs.length}`); } return rigs; } export function totalWeight(rigs: Rig[]): number { return rigs.reduce((sum, rig) => sum + rig.weightKg, 0); } export function slotFor(rigs: Rig[], name: string): string | null { const found = rigs.find((rig) => rig.name === name); return found?.slot ?? null; } // installed dates sort oldest first, so the newest rig prints last export function byInstalled(rigs: Rig[]): Rig[] { return [...rigs].sort((a, b) => a.installed.localeCompare(b.installed)); }"
