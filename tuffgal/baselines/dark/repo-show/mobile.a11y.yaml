  - heading "Linklater" [level=1]
  - paragraph: Save a URL, read it later. Linklater keeps a reading list you can push to from anywhere, with no account and no client-side JavaScript.
  - heading "Install" [level=2]
  - code: git clone git@carn.example:linklater.git cd linklater npm install
  - heading "Refs" [level=2]
  - table:
    - rowgroup:
      - row "Ref Kind Note":
        - columnheader "Ref"
        - columnheader "Kind"
        - columnheader "Note"
    - rowgroup:
      - row "main branch the default":
        - cell "main":
          - code: main
        - cell "branch"
        - cell "the default"
      - row "v1.2.0 tag the last release":
        - cell "v1.2.0":
          - code: v1.2.0
        - cell "tag"
        - cell "the last release"
  - heading "Notes" [level=2]
  - list:
    - listitem: The reading list is one table, and one index on it
    - listitem: Fetches run on a timer, never on a page load
    - listitem:
      - text: Read the
      - link "brand notes":
        - /url: /r/linklater/blob/main/docs/BRAND.md
      - text: ", the"
      - link "spec":
        - /url: /docs/spec
      - text: ", the"
      - link "type scale":
        - /url: "#type"
      - text: ", or send"
      - link "mail":
        - /url: mailto:hi@example.com
  - blockquote:
    - paragraph: Quiet software is the goal.
- contentinfo:
