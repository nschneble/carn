name: carn

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carn
      POSTGRES_USER: carn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carn}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - carn-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carn -d carn"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  visual:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    platform: linux/arm64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://carn:${POSTGRES_PASSWORD:-carn}@postgres:5432/carn
    working_dir: /carn
    volumes:
      - .:/carn
      - carn-visual-dist:/carn/dist
      - carn-visual-generated:/carn/src/generated
      - carn-visual-local:/carn/local
      - carn-visual-modules:/carn/node_modules

volumes:
  carn-postgres:
  carn-visual-dist:
  carn-visual-generated:
  carn-visual-local:
  carn-visual-modules:
